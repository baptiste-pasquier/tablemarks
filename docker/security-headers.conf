# Security headers (R29), in one place.
#
# nginx's `add_header` is inherited by a location only if that location declares NO add_header of
# its own. `location = /config.json` needs its own Cache-Control, so it has to restate the whole
# set — which is why this is an include rather than a single server-level declaration. Every other
# location uses `expires` (a different directive) precisely so it keeps inheriting.
#
# This file is NOT a template: the nginx image's 20-envsubst-on-templates.sh renders
# /etc/nginx/templates/*.template into /etc/nginx/conf.d/, and anything landing there is picked up
# by the main config's `include /etc/nginx/conf.d/*.conf` at http level — these headers would then
# apply to every server block and be sent twice. So it is copied to /etc/nginx/snippets/ verbatim,
# and the one value that depends on the environment reaches it through $tablemarks_csp, which
# default.conf.template sets at server level from ${TABLEMARKS_POCKETBASE_URL}.
#
# $tablemarks_csp survives templating because that script substitutes only names that are actually
# present in the container's environment, and this one never is — the same reason nginx's own $uri
# survives. NGINX_ENVSUBST_FILTER is a second guard on top of that, not what makes it work.
# Verified on nginx:1.29-alpine with and without the filter set.

add_header Content-Security-Policy $tablemarks_csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
