# Server configuration for the private (root-served) Tablemarks target.
#
# This file ships as /etc/nginx/templates/default.conf.template. The nginx image's own
# 20-envsubst-on-templates.sh renders it to /etc/nginx/conf.d/default.conf at container start,
# so ${TABLEMARKS_POCKETBASE_URL} below is filled in by the operator's environment and no
# deployment-specific hostname is ever baked into the image (KD2/R3).
#
# NGINX_ENVSUBST_FILTER=^TABLEMARKS_ is set in the Dockerfile: only variables with that prefix
# are substituted, so nginx's own $uri / $host / $request_uri survive untouched no matter what
# else the operator puts in the environment.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------------
    # Security headers (R29)
    #
    # The auth token lives in browser storage on this origin, so any script that executes here
    # is a full account takeover. `connect-src` is the directive that stops a hostile script
    # exfiltrating that token: it names the backend (templated above) plus the only two
    # third-party hosts the app legitimately talks to.
    #
    # Every destination the app reaches has to be named, in every directive that governs it — the
    # backend included, not only the third parties:
    #
    #   ${TABLEMARKS_POCKETBASE_URL} — the API and realtime channel (connect-src) AND the signed-in
    #                                 user's avatar, served by PocketBase (img-src). Omitting it
    #                                 from img-src does not show a broken image: AccountMenu falls
    #                                 back to the email initial, so it reads as a design choice.
    #   nominatim.openstreetmap.org — geocoding (src/capture/geocode.ts), fetched by the page
    #   tile.openstreetmap.org      — map tiles (src/features/map/MapView.tsx). Needed in BOTH
    #                                 img-src (the <img> the TileLayer creates) and connect-src
    #                                 (the service worker re-fetches tiles with fetch() to fill
    #                                 its CacheFirst store — see vite.config.ts)
    #   fonts.googleapis.com/gstatic.com — the webfont <link> in index.html
    #
    # 'unsafe-inline' is granted to style-src only. Tailwind's runtime and Leaflet both write
    # inline styles; script-src stays strict, which is what the token depends on.
    #
    # The value is a variable and the header set is an include, so both exist once. See
    # docker/security-headers.conf for why the include cannot itself be a template.
    # -----------------------------------------------------------------------
    set $tablemarks_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://tile.openstreetmap.org ${TABLEMARKS_POCKETBASE_URL}; connect-src 'self' https://nominatim.openstreetmap.org https://tile.openstreetmap.org ${TABLEMARKS_POCKETBASE_URL}; worker-src 'self'; manifest-src 'self'; frame-src 'none'";
    include /etc/nginx/snippets/security-headers.conf;

    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # -----------------------------------------------------------------------
    # Health endpoint (R10). Declared before the SPA fallback so it is never shadowed.
    # No add_header here, so the security headers above are inherited.
    # -----------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------------------
    # Runtime configuration (R3/R29). Written at container start by
    # /docker-entrypoint.d/30-write-config.sh; carries the backend URL and nothing else.
    #
    # `no-store`, not `no-cache`: the operator must be able to repoint the backend by
    # restarting the container, and a cached copy would pin the old URL. The service worker
    # fetches this file network-first (vite.config.ts) — this header is the matching half.
    #
    # An exact-match location, so the SPA fallback below can never serve index.html here.
    # -----------------------------------------------------------------------
    location = /config.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        try_files /config.json =404;
    }

    # Vite emits content-hashed filenames under /assets/, so they are safe to pin forever.
    # `expires` rather than add_header, to keep inheriting the security headers above.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # The service worker and the app shell must always be revalidated, or a redeploy never
    # reaches an installed client.
    location = /sw.js          { expires -1; }
    location = /index.html     { expires -1; }
    location = /manifest.webmanifest { expires -1; }

    # -----------------------------------------------------------------------
    # SPA fallback: a deep link must serve the app shell, not a 404.
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
