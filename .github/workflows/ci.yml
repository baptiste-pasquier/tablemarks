# Continuous integration: every push and every pull request runs the whole gate.
#
# Both build targets are built here on purpose. A regression that only breaks the public demo
# — a root-absolute asset path, a manifest `start_url` that ignores the subpath — passes the
# type check, the tests and the private build, and would otherwise only be discovered after
# merge, with the demo already broken.
name: CI

on:
  push:
  pull_request:

# A CI job only reads the code.
permissions:
  contents: read

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Type check, lint, tests, docs, both builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The major comes from `.nvmrc`, the repository's single source of truth for it: the same
      # value `package.json`'s `engines` declares and `docker/Dockerfile` defaults NODE_VERSION
      # to. A green run here is therefore a green run on the major the image is built with.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # scripts/check_docs.py is standard library only, so any modern CPython will do.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Needs no node_modules, so it runs before the install and fails fast.
      - name: Documentation gate
        run: npm run check:docs

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc --noEmit && vite build`. CI runs those two halves as separate
      # steps so the type check has its own named result and so it runs once, not once per
      # target: the composition below is exactly what the container image's `npm run build`
      # executes, plus the second target.
      - name: Type check
        run: npm run type-check

      # Both run in check mode: CI reports, it never rewrites. `npm run format` and
      # `npm run lint` are the local commands that fix what these two flag.
      - name: Formatting
        run: npx prettier . --check

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm test

      - name: Build the private target
        run: npx vite build

      # The public demo is served from the GitHub Pages repository subpath. The base is derived
      # from the repository name rather than hardcoded, so a rename or a fork needs no edit.
      - name: Build the public demo target
        run: npx vite build --mode demo --base="/${GITHUB_REPOSITORY#*/}/"

      # The same guard the deploy workflow runs, and the reason it is a script. Building the demo
      # only proves `vite build` exits zero; what defines this target is what it must NOT contain.
      # Asserting that here is what blocks the merge, rather than failing after it with the demo
      # already broken on an origin that cannot unregister a worker.
      - name: Guard the demo target
        run: scripts/check-demo-target.sh dist
