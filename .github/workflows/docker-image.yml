# Builds one container image, and publishes it only when the caller says so.
#
# Called twice by docker-build.yml — once for a pull request with `publish: false`, once for a push
# to `main` with `publish: true`. It exists so the matrix and the build steps are written once: two
# copies of a build drift, and the copy that drifts is the one nobody watches.
#
# Why a reusable workflow rather than one job with an `if:`-gated login. Job permissions are static
# — there is no conditional `permissions:` — so a single job would have to carry `packages: write`
# on pull requests too. The caller declares permissions per invocation, so the pull-request path
# keeps holding no credential that could publish. That property is the point; the deduplication is
# what this shape buys on top of it.
name: Container image

on:
  workflow_call:
    inputs:
      publish:
        description: Push the built image to the registry. False builds and discards.
        type: boolean
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: ${{ inputs.publish && 'Publish' || 'Build' }} ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tablemarks-app
            dockerfile: docker/Dockerfile
          - image: tablemarks-pocketbase
            dockerfile: docker/Dockerfile.pocketbase
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # linux/arm64 is built under emulation: the runners are amd64 only.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      # The default builder cannot do multi-platform; buildx can. docker/Dockerfile also needs it
      # for $BUILDPLATFORM, which the legacy builder does not define.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Skipped entirely on the build-only path, which is also not granted `packages: write`.
      - name: Log in to ${{ env.REGISTRY }}
        if: inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The name is derived, not hardcoded, so a fork publishes under its own owner — and is
      # lower-cased because GHCR rejects an uppercase path even though GitHub allows the owner.
      # For this repository it resolves to ghcr.io/baptiste-pasquier/tablemarks-app and
      # ghcr.io/baptiste-pasquier/tablemarks-pocketbase, which is character-for-character what
      # docker/docker-compose.prod.yml pulls by default.
      #
      # Resolved on both paths, so the build-only run exercises the same expression the publishing
      # run depends on rather than leaving it untested until it matters.
      - name: Resolve the image reference
        id: image
        run: |
          set -eu
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "ref=${REGISTRY}/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      # `context: .` is the repository root — both Dockerfiles COPY paths relative to it
      # (docker/nginx.conf, pocketbase/pb_migrations, …), exactly as docker-compose.yml builds
      # them. `.dockerignore` at the root keeps pb_data and the host-built binary out.
      #
      # `tags` is set on both paths: build-push-action needs a name to work with, and with
      # `push: false` nothing leaves the runner.
      - name: ${{ inputs.publish && 'Build and publish' || 'Build' }} ${{ matrix.image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish }}
          # Both matrix legs read the same `github.sha`, so the two images always carry the same
          # immutable tag for a given run (KTD7/R28). `latest` is the moving tag; the SHA is the
          # one an operator can roll back to.
          tags: |
            ${{ steps.image.outputs.ref }}:${{ github.sha }}
            ${{ steps.image.outputs.ref }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # The operator needs the exact string to paste into TABLEMARKS_IMAGE_TAG. Printing it in the
      # run summary saves a trip to the package page, where the two images are listed separately
      # and nothing states that they must move together.
      - name: Record the deployable tag
        if: inputs.publish
        run: |
          {
            echo "### ${{ steps.image.outputs.ref }}"
            echo
            echo '```'
            echo "TABLEMARKS_IMAGE_TAG=${{ github.sha }}"
            echo '```'
            echo
            echo 'Both images in this run carry this tag. Upgrade them together.'
          } >> "$GITHUB_STEP_SUMMARY"
